name: 開発タスク
description: 実装内容・完了条件・テスト方法を定義する
title: "[開発] "
body:
  - type: markdown
    attributes:
      value: |
        実装者が着手できる粒度で記載してください。小さな作業には「簡易タスク」を使えます。
        個人情報、APIキー、非公開の原データを本文・ログに貼らないでください。
  - type: textarea
    id: goal
    attributes:
      label: 目的・期待する動作
      description: 誰が何をできるようになるか。現状の課題も記載してください。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 実装範囲・対象外
      description: 変更する機能・ファイル・画面、今回対応しないこと。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件（Acceptance Criteria）
      description: 検証可能な条件を箇条書きで記載してください。
      placeholder: |
        - [ ] ○○が動作する
        - [ ] 既存の△△に影響しない
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: テスト・確認方法
      description: 正常系、異常系、境界値、再現手順。未定なら「未定」と記載してください。
    validations:
      required: false
  - type: textarea
    id: risks
    attributes:
      label: リスク・依存関係
      description: 破壊的変更、権限、他Issueとの依存、必要なレビュー・承認など。
    validations:
      required: false
  - type: dropdown
    id: execution_environment
    attributes:
      label: 主な実行環境（任意）
      options:
        - クラウドCPU
        - ローカルCPU
        - ローカルGPU
        - 複数環境・その他
        - 実行不要・未定
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 関連Issue・PR・設計資料
      description: 依存Issue、参考文書、関連PRなど。
    validations:
      required: false
  - type: checkboxes
    id: confidentiality
    attributes:
      label: 情報管理の確認
      options:
        - label: 個人情報・機密データの原本・認証情報をIssueに記載していません。
          required: true
